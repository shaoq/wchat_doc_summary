schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  Tech stack: Python 3.10+, SQLite, Click, Rich, httpx
  Domain: 微信公众号文章订阅系统

  **重要规范**:
  - 实施任何功能变更时，必须遵循 OpenSpec opsx 工作流
  - 使用 /opsx:explore 进行探索和规划
  - 使用 /opsx:new 创建变更提案 (proposal)
  - 使用 /opsx:apply 实施变更
  - 使用 /opsx:archive 归档完成的变更
  - 不要跳过 opsx 流程直接实施代码修改

